      }
      return {err:'구글시트 내용을 읽지 못했습니다.'};
    }catch(e){
      const c = e && e.code;
      if(c==='server_not_connected') return {err:'claude.ai 설정 → 커넥터에서 Google Drive를 연결하면 불러올 수 있습니다.'};
      if(c==='not_in_manifest') return {err:'이 화면에서 Google Drive 사용이 꺼져 있습니다.'};
      if(c==='needs_reauth') return {err:'claude.ai 설정 → 커넥터에서 Google Drive를 다시 연결해 주세요.'};
      return {err:'구글시트를 불러오지 못했습니다.'};
    }
  }
  async function saveSheet(rows, src){
    const at = new Date().toISOString();
    const prev = st.sheet||{}; const same = JSON.stringify(rows)===JSON.stringify(prev.rows||[]);
    const fresh = prev.at && (Date.now()-new Date(prev.at).getTime()) < 30*60000;
    st.sheet = {rows, at, src}; st.sheetErr=''; render();
    if(st.db && !st.readOnly && st.dbState==='ready' && !(same && fresh)){
      await write(()=>st.db.collection('sheetSync').doc('latest').set({rows, at, src, n:rows.length, same}));
    }
  }
  async function refreshSheet(manual){
    if(st.sheetBusy) return;
    st.sheetBusy='불러오는 중…'; st.sheetErr=''; renderSheetBar();
    let rows = await fetchDirect(); let src='direct';
    if(!rows && manual){ const r = await fetchViaDrive(); rows = r.rows||null; src='drive'; if(!rows) st.sheetErr = r.err||''; }
    st.sheetBusy='';
    if(rows) await saveSheet(rows, src);
    else { if(manual && !st.sheetErr) st.sheetErr='구글시트를 불러오지 못했습니다.'; renderSheetBar(); }
    if(manual && rows) toast(`검토 대시보드 발행 기록 ${rows.length}줄을 불러왔습니다`);
  }
  document.addEventListener('click',e=>{ if(e.target && e.target.closest && e.target.closest('#sheet-btn')) refreshSheet(true); });

  /* ---------- events ---------- */
  $('tab-cos').addEventListener('click',()=>setTab('cos'));
  $('tab-stats').addEventListener('click',()=>setTab('stats'));
  $('tab-trash').addEventListener('click',()=>setTab('trash'));
  $('up-btn').addEventListener('click',()=>$('up-file').click());
  $('up-file').addEventListener('change',e=>{ readFile(e.target.files[0]); e.target.value=''; });
  $('upbox').addEventListener('click',e=>{ const b=e.target.closest('[data-up]'); if(!b) return; if(b.dataset.up==='cancel'){ st.upload=null; renderUpload(); } else if(b.dataset.up==='go') commitUpload(); else if(b.dataset.up==='estgo') commitEstimate(); });
  $('upbox').addEventListener('input',e=>{ if(st.upload && st.upload.estimate && e.target.id!=='es-link'){ syncEstimate(); const E=st.upload.estimate; const ok=E.ty&&E.company&&E.date&&st.dbState==='ready'&&!st.readOnly; const g=$('upbox').querySelector('[data-up="estgo"]'); if(g) g.disabled=!ok; if(e.target.id==='es-amt'){ const v=e.target.value.replace(/[^\d]/g,''); e.target.value=v?Number(v).toLocaleString('ko-KR'):''; } } });
  $('upbox').addEventListener('change',e=>{
    if(e.target.matches && e.target.matches('[data-reqon]')){ st.upload.reqOn = e.target.checked; renderUpload(); return; }
    if(st.upload && st.upload.estimate){ syncEstimate(); renderEstimate(); return; }
    const on=e.target.closest('[data-upon]'); if(on){ st.upload.sheets[+on.dataset.upon].on=on.checked; renderUpload(); return; }
    const yi=e.target.closest('[data-upyear]'); if(yi){ const v=yi.value.trim(); if(/^20\d\d$/.test(v)){ const sh=st.upload.sheets[+yi.dataset.upyear]; sh.year=v; sh.rows.forEach(r=>{ if(r.dr && !r.d){ const m=r.dr.match(/^(\d{1,2})\/(\d{1,2})/); if(m) r.d=`${v}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`; } }); } renderUpload(); }
  });
  (()=>{ const v=$('view-stats'), z=$('dropzone'); let depth=0;
    const hasFile = e => [...(e.dataTransfer&&e.dataTransfer.types||[])].includes('Files');
    v.addEventListener('dragenter',e=>{ if(!hasFile(e)) return; e.preventDefault(); depth++; z.hidden=false; });
    v.addEventListener('dragover',e=>{ if(!hasFile(e)) return; e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
    v.addEventListener('dragleave',e=>{ if(!hasFile(e)) return; depth=Math.max(0,depth-1); if(!depth) z.hidden=true; });
    v.addEventListener('drop',e=>{ if(!hasFile(e)) return; e.preventDefault(); e.stopPropagation(); depth=0; z.hidden=true; readFile(e.dataTransfer.files[0]); });
    // 탭 밖에 떨어뜨려도 브라우저가 파일을 열지 않도록
    window.addEventListener('dragover',e=>{ if(hasFile(e)) e.preventDefault(); });
    window.addEventListener('drop',e=>{ if(hasFile(e)){ e.preventDefault(); if(st.tab!=='stats'){ setTab('stats'); } readFile(e.dataTransfer.files[0]); } });
  })();
  $('yearbar').addEventListener('click',e=>{ const b=e.target.closest('.ychip'); if(!b) return; st.year=b.dataset.y; st.month=''; st.openCo=''; render(); });
  $('q-trash').addEventListener('input',e=>{st.qt=e.target.value;renderTrash();});
  $('f-tkind').addEventListener('change',e=>{st.tkind=e.target.value;renderTrash();});
  $('empty-trash').addEventListener('click',e=>emptyTrash(e.currentTarget));
  $('tb-trash').addEventListener('click',e=>{
    const rb=e.target.closest('[data-restore]'); if(rb){ restoreItem(rb.dataset.restore, rb); return; }
    const pb=e.target.closest('[data-purge]'); if(pb){ purgeItem(pb.dataset.purge, pb); }
  });
  $('f-year').addEventListener('change',e=>{st.year=e.target.value; st.month=''; render();});
  document.querySelectorAll('input[name="f-kind"]').forEach(r=>r.addEventListener('change',e=>{ if(e.target.checked){ st.kind=e.target.value; render(); } }));
  $('q-stats').addEventListener('input',e=>{st.qs=e.target.value;render();});
  // 업체 발행 기록 안의 검색 (다시 그려도 입력 위치 유지)
  document.addEventListener('input',e=>{ if(e.target && e.target.id==='cq'){ st.cq=e.target.value; const pos=e.target.selectionStart; render(); const n=$('cq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } } });
  $('f-onlysent').addEventListener('change',e=>{st.onlySent=e.target.checked;render();});
  $('q-sites').addEventListener('input',e=>{st.q=e.target.value;render();});
  $('q-cos').addEventListener('input',e=>{st.qc=e.target.value;render();});
  $('f-region').addEventListener('change',e=>{st.region=e.target.value;render();});
  $('f-cosort').addEventListener('change',e=>{st.cosort=e.target.value;render();});
  $('f-company').addEventListener('change',e=>{st.company=e.target.value;render();});
  $('f-stage').addEventListener('change',e=>{st.stage=e.target.value;render();});
  $('f-sort').addEventListener('change',e=>{st.sort=e.target.value;render();});
  $('add-site').addEventListener('click',()=>openSite(null));
  $('add-co').addEventListener('click',()=>openCo(null));
  $('tiles').addEventListener('click',e=>{
    const t=e.target.closest('[data-kt]'); if(!t) return;
    if(t.dataset.kt){ st.kind=t.dataset.kt; const r=document.getElementById('f-kind-'+st.kind); if(r) r.checked=true; }
    st.month='';
    if(st.tab!=='stats') setTab('stats'); else render();
  });

  document.addEventListener('click',e=>{
    const di=e.target.closest('[data-delissue]'); if(di){ deleteManual(di.dataset.delissue, di); return; }
    const lc=e.target.closest('[data-logco]');
    if(lc){ st.openCo = st.openCo===lc.dataset.logco ? '' : lc.dataset.logco; st.cq=''; render(); return; }
    const cy=e.target.closest('[data-cpyear]'); if(cy){ st.year=cy.dataset.cpyear; st.month=''; render(); return; }
    const co=e.target.closest('[data-co]');
    if(co){ e.stopPropagation(); return; }
    const row=e.target.closest('#tb-sites tr[data-id]');
    if(row && !row.classList.contains('sample')){ openSite(st.sites.find(s=>s.id===row.dataset.id)); return; }
    const crow=e.target.closest('#tb-cos tr[data-coid]');
    if(crow && !crow.classList.contains('sample')){ openCo(st.cos.find(c=>c.id===crow.dataset.coid)); }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && st.editing) closeDrawer();
    if(e.key==='Enter' && e.target.matches && e.target.matches('tbody tr[tabindex="0"]')) e.target.click();
  });

  let startTab='stats';
  try{ const t=localStorage.getItem('ce-tab'); if(t==='cos'||t==='stats'||t==='trash') startTab=t; }catch(e){}
  setTab(startTab);

  /* ---------- data ---------- */
  (async()=>{
    let db=null;
    try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
    if(!db){
      // 다운로드한 파일: 파일 안에 담긴 저장본(스냅샷)으로 화면을 채움. 고친 내용은 이 창 안에서만 유지됨
      const el = document.getElementById('snapshot-data');
      if(!el){ st.dbState='off'; render(); return; }
      const store = JSON.parse(el.textContent); const subs=[]; let seq=0;
      const snapOf = c => { const docs = Object.keys(store).filter(p=>p.split('/')[0]===c).map(p=>({id:p.split('/')[1], exists:true, data:()=>store[p], metadata:{}})); return {docs, size:docs.length, empty:!docs.length}; };
      const fire = () => setTimeout(()=>subs.forEach(x=>x.cb(snapOf(x.c))),0);
      const docRef = (c,id) => ({ id, get: async()=>({id, exists: (c+'/'+id) in store, data:()=>store[c+'/'+id], metadata:{}}),
        set: async d=>{ store[c+'/'+id]=JSON.parse(JSON.stringify(d)); fire(); },
        update: async d=>{ store[c+'/'+id]=Object.assign({}, store[c+'/'+id]||{}, JSON.parse(JSON.stringify(d))); fire(); },
        delete: async()=>{ delete store[c+'/'+id]; fire(); } });
      db = { collection: c => ({ doc: id => docRef(c, id || ('local-'+Date.now()+'-'+(++seq))), onSnapshot: cb => { subs.push({c,cb}); setTimeout(()=>cb(snapOf(c)),0); return ()=>{}; } }) };
      st.snapshot = true;
    }
    st.db=db; st.dbState='ready';
    // 계정 이동용: 비어 있는 현황판이면 파일에 담긴 데이터를 넣을 수 있게 함
    const snapEl = document.getElementById('snapshot-data');
    let logsLoaded=false;
    const checkImport = () => { if(snapEl && !st.snapshot && !st.importing && st.cosLoaded && logsLoaded){ const v = !st.cos.length && !st.logs.length && !st.readOnly; if(v!==!!st.canImport){ st.canImport=v; render(); } } };
    document.addEventListener('click', async e=>{
      if(!e.target.closest('#do-import') || st.importing) return;
      const store = JSON.parse(snapEl.textContent); const keys = Object.keys(store);
      st.importing=true; st.importDone=0; st.importTotal=keys.length; render();
      let fail=0;
      for(const k of keys){ const [c,id]=k.split('/'); try{ await db.collection(c).doc(id).set(store[k]); }catch(err){ fail++; } st.importDone++; if(st.importDone%10===0) render(); }
      st.importing=false; st.canImport=false; render();
      toast(fail ? `${keys.length-fail}건 넣음 · ${fail}건 실패 (한 번 더 눌러 주세요)` : `데이터 ${keys.length}건을 모두 넣었습니다`);
      if(fail){ st.canImport=true; render(); }
    });
    try{
      const user = await window.claude.use('user');
      if(user && user.can){ const w = await user.can('data.write'); if(w===false) st.readOnly=true; }
    }catch(e){}
    const onErr = e => { if(e && (e.code==='revoked'||e.code==='not_granted')){ st.dbState='off'; render(); } };
    db.collection('sites').onSnapshot(snap=>{
      st.sites = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); st.sitesLoaded=true; render();
    }, onErr);
    db.collection('companies').onSnapshot(snap=>{
      st.cos = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); st.cosLoaded=true; render(); checkImport();
    }, onErr);
    db.collection('issueLogs').onSnapshot(snap=>{
      const L=[]; const D=[]; snap.docs.forEach(d=>{ const v=d.data()||{}; D.push({id:d.id, year:String(v.year||''), n:(v.rows||[]).length, importedAt:v.importedAt||'', file:v.file||v.source||''}); (v.rows||[]).forEach(r=>L.push(r)); });
      st.logs=L; st.logDocs=D; logsLoaded=true; render(); checkImport();
    }, onErr);
    db.collection('issueManual').onSnapshot(snap=>{
      st.manual = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); render();
    }, onErr);
    db.collection('trash').onSnapshot(snap=>{
      st.trash = snap.docs.map(d=>Object.assign({id:d.id}, d.data())); renderTrash();
    }, onErr);
    db.collection('sheetSync').onSnapshot(snap=>{
      const d = snap.docs.find(x=>x.id==='latest'); if(!d) return; const v=d.data()||{};
      if(Array.isArray(v.rows) && (!st.sheet.at || (v.at||'') >= st.sheet.at)){ st.sheet = {rows:v.rows, at:v.at||'', src:v.src||''}; render(); }
    }, onErr);
    render();
    refreshSheet(false);   // 열 때마다 구글시트 최신 기록을 한 번 읽어 봄 (안 되면 보관된 기록으로 표시)
  })();
})();
</script>

</body></html>
