<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>컨설팅내역서 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EBEFED; --ink:#18201E; --muted:#5B6863; --faint:#8A9691;
  --line:#D9E0DC; --accent:#0E6B62; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --s-none:#8A9691; --s-none-bg:#ECEFEE;
  --s-wip:#9A5B00; --s-wip-bg:#FCEFD8;
  --s-sent:#1D55B8; --s-sent-bg:#DFE9FB;
  --s-done:#137A3E; --s-done-bg:#DBF1E3;
  --k-draft:#1E8A4C; --k-draft-bg:#DDF2E5; --k-final:#C2540A; --k-final-bg:#FDE8D6;
  --warn:#B4351F; --warn-bg:#FBE3DE;
  --shadow:0 10px 40px rgba(20,35,30,.18);
  --hero:#123C5A; --hero-ink:#FFFFFF; --hero-sub:#B9CDDD; --hero-line:rgba(255,255,255,.22); --hero-chip:rgba(255,255,255,.08); --hero-glow:rgba(76,194,178,.45); --s-sent-hero:#8DB2F5;
  --tab-bg:#E3ECF4; --tab-bg-hover:#D3E1EE; --tab-ink:#123C5A; --tab-on:#123C5A; --tile-line:#D5E0EA; --tile-num:#123C5A;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121715; --surface:#1A201E; --surface-2:#222A27; --ink:#E6ECE9; --muted:#9DABA5; --faint:#6F7C77;
    --line:#2E3834; --accent:#4CC2B2; --accent-ink:#0B1412; --accent-soft:#17332E;
    --s-none:#94A09B; --s-none-bg:#262E2B;
    --s-wip:#F0B35A; --s-wip-bg:#3A2C14;
    --s-sent:#8DB2F5; --s-sent-bg:#1C2A45;
    --s-done:#6FD39A; --s-done-bg:#16321F;
    --k-draft:#6FD39A; --k-draft-bg:#16321F; --k-final:#F5A05A; --k-final-bg:#3D2612;
    --warn:#F08A76; --warn-bg:#3D1F19;
    --shadow:0 10px 40px rgba(0,0,0,.5);
    --hero:#16324A; --hero-ink:#EAF2F8; --hero-sub:#9FB6C8; --hero-line:rgba(255,255,255,.18); --hero-chip:rgba(255,255,255,.06); --tab-bg:#1B2A38; --tab-bg-hover:#233648; --tab-ink:#BFD3E4; --tab-on:#2E5B80; --tile-line:#26394B; --tile-num:#9CC3E4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --surface:#1A201E; --surface-2:#222A27; --ink:#E6ECE9; --muted:#9DABA5; --faint:#6F7C77;
  --line:#2E3834; --accent:#4CC2B2; --accent-ink:#0B1412; --accent-soft:#17332E;
  --s-none:#94A09B; --s-none-bg:#262E2B;
  --s-wip:#F0B35A; --s-wip-bg:#3A2C14;
  --s-sent:#8DB2F5; --s-sent-bg:#1C2A45;
  --s-done:#6FD39A; --s-done-bg:#16321F;
  --k-draft:#6FD39A; --k-draft-bg:#16321F; --k-final:#F5A05A; --k-final-bg:#3D2612;
  --warn:#F08A76; --warn-bg:#3D1F19;
  --shadow:0 10px 40px rgba(0,0,0,.5);
  --hero:#16324A; --hero-ink:#EAF2F8; --hero-sub:#9FB6C8; --hero-line:rgba(255,255,255,.18); --hero-chip:rgba(255,255,255,.06); --tab-bg:#1B2A38; --tab-bg-hover:#233648; --tab-ink:#BFD3E4; --tab-on:#2E5B80; --tile-line:#26394B; --tile-num:#9CC3E4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
  background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:22px 24px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--hero-glow) 0%,transparent 70%);pointer-events:none}
.top > *{position:relative;z-index:1}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:0}
.themesw{display:inline-flex;padding:3px;border-radius:999px;background:var(--hero-chip);border:1px solid var(--hero-line)}
.themesw button{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border:0;border-radius:999px;background:none;color:var(--hero-sub);font-size:12px;font-weight:600}
.themesw button svg{width:14px;height:14px}
.themesw button:hover{color:var(--hero-ink)}
.themesw button[aria-checked="true"]{background:var(--hero-ink);color:var(--hero)}
.themesw button:focus-visible{outline:2px solid var(--hero-ink);outline-offset:1px}
@media (max-width:640px){.topright{align-items:flex-start;width:100%}}
.brand{display:flex;align-items:center;gap:20px;min-width:0}
.brand .logo{height:40px;width:auto;display:block;flex:none}
.brand .bdiv{width:1px;align-self:stretch;min-height:44px;background:var(--hero-line)}
@media (max-width:640px){.brand{flex-direction:column;align-items:flex-start;gap:10px}.brand .bdiv{display:none}.brand .logo{height:30px}}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.01em;color:var(--hero-ink)}
.top p{margin:4px 0 0;color:var(--hero-sub);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--hero-sub)}
.flow span{padding:3px 10px;border:1px solid var(--hero-line);border-radius:999px;background:var(--hero-chip);color:var(--hero-ink)}
.flow span:nth-last-child(3){border-color:var(--s-sent-hero)}
.flow span:last-child{background:var(--hero-ink);color:var(--hero);font-weight:600;border-color:var(--hero-ink)}
.flow i{font-style:normal;color:var(--hero-sub)}

/* banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.banner b{color:var(--accent)}
.banner.err{background:var(--warn-bg)}
.banner.err b{color:var(--warn)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--tile-line);border-radius:12px;padding:14px 16px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.tile:hover{border-color:var(--tab-on);transform:translateY(-1px);box-shadow:0 4px 14px rgba(18,60,90,.10)}
.tile .lab{font-size:13px;font-weight:600;color:var(--tile-num);display:flex;align-items:center;justify-content:space-between;gap:6px}
.tile .lab i{font-style:normal;font-size:11px;font-weight:500;color:var(--muted);font-family:var(--mono)}
.tile .val{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;color:var(--tile-num);display:flex;align-items:baseline;gap:4px}
.tile .val small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted)}
.tile .meter{height:5px;border-radius:999px;background:var(--tab-bg);overflow:hidden}
.tile .meter b{display:block;height:100%;border-radius:999px;background:var(--tile-num)}
.tile .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.t-all{background:var(--tab-on);border-color:var(--tab-on)}
.tile.t-all .lab,.tile.t-all .val,.tile.t-all .val small,.tile.t-all .sub,.tile.t-all .lab i{color:#fff}
.tile.t-all .sub,.tile.t-all .lab i,.tile.t-all .val small{opacity:.8}
.tile.t-all .meter{background:rgba(255,255,255,.2)}.tile.t-all .meter b{background:#fff}
.tile.on{border-color:var(--tab-on);box-shadow:inset 0 0 0 2px var(--tab-on)}
.tile.on .lab::after{content:"필터 중";font-size:11px;font-weight:600;color:#fff;background:var(--tab-on);border-radius:999px;padding:1px 8px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tiles.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.tiles.k3{grid-template-columns:1fr}}
.tile.kt{--kc:var(--k-draft);border-top:4px solid var(--kc);background:color-mix(in srgb,var(--kc) 5%,var(--surface))}
.tile.kt.kf{--kc:var(--k-final)}
.tile.kt .lab,.tile.kt .val{color:var(--kc)}
.tile.kt .meter{background:color-mix(in srgb,var(--kc) 16%,var(--surface))}
.tile.kt .meter b{background:var(--kc)}
.tile.kt:hover{border-color:var(--kc);border-top-color:var(--kc)}
.tile.kt.on{border-color:var(--kc);box-shadow:inset 0 0 0 2px var(--kc)}
.tile.kt.on .lab::after{content:"보는 중";background:var(--kc);white-space:nowrap}
.tile.kt.on .lab i{display:none}
.tile.kt .lab{white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.kt.on .lab::after{color:#0B1412}}
:root[data-theme="dark"] .tile.kt.on .lab::after{color:#0B1412}
.tile.t-last .val{font-size:22px;padding-top:6px}
.ychip .yd{color:var(--k-draft)}.ychip .yf{color:var(--k-final)}
.ychip[aria-pressed="true"] .yd,.ychip[aria-pressed="true"] .yf{color:#fff}
.legend .kd-dot{background:var(--k-draft)}.legend .kf-dot{background:var(--k-final)}

/* pipeline bar */
.pipe{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.pipe div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}

/* tabs + toolbar */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{white-space:nowrap}
#tab-sites,#tab-cos,#tab-stats{color:var(--tab-ink);background:var(--tab-bg);border-radius:8px 8px 0 0;padding-inline:14px;transition:background .15s}
#tab-sites .cnt,#tab-cos .cnt{color:var(--tab-ink);opacity:.75}
#tab-sites:hover,#tab-cos:hover,#tab-stats:hover{background:var(--tab-bg-hover)}
#tab-sites[aria-selected="true"],#tab-cos[aria-selected="true"],#tab-stats[aria-selected="true"]{color:#fff;background:var(--tab-on);border-bottom-color:var(--tab-on)}
#tab-sites[aria-selected="true"] .cnt,#tab-cos[aria-selected="true"] .cnt{color:#fff;opacity:.85}
#tab-trash{color:var(--warn);background:var(--warn-bg);border-radius:8px 8px 0 0;padding-inline:14px}
#tab-trash .cnt{color:var(--warn);font-weight:600}
#tab-trash:hover{filter:brightness(0.97)}
#tab-trash[aria-selected="true"]{color:#fff;background:var(--warn);border-bottom-color:var(--warn)}
#tab-trash[aria-selected="true"] .cnt{color:#fff}
.tab{border:0;background:none;padding:8px 12px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--faint);margin-left:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}
.field{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%}
select.field{padding-right:4px}
.toolbar select.field{width:auto;max-width:100%}
.btn{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chipfilter{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:999px;background:var(--accent-soft);font-size:12px}
.chipfilter button{border:0;background:none;padding:0 4px;color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:920px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.sample{cursor:default}
td .name{font-weight:600}
td .meta{font-size:12px;color:var(--muted)}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.none{color:var(--s-none);background:var(--s-none-bg)}
.pill.wip{color:var(--s-wip);background:var(--s-wip-bg)}
.pill.sent{color:var(--s-sent);background:var(--s-sent-bg)}
.pill.done{color:var(--s-done);background:var(--s-done-bg)}
.pill.late{color:var(--warn);background:var(--warn-bg)}
.pill.ex{color:var(--accent);background:var(--accent-soft)}
.docstate{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.docstate .d{font-size:11px;color:var(--faint);font-family:var(--mono)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}
.linkbtn:hover{text-decoration:underline}
.mini{display:flex;gap:3px;align-items:center}
.mini i{display:block;width:14px;height:6px;border-radius:2px;background:var(--surface-2)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:17px}
.xbtn{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.drawer form{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.drawer footer{display:flex;gap:8px;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer footer .right{display:flex;gap:8px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:12px;font-weight:600;color:var(--muted)}
.fl label em{color:var(--warn);font-style:normal}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:13px;font-weight:700;padding:0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px 4px;font-size:13px;cursor:pointer;border-left:1px solid var(--line);color:var(--muted)}
.seg label:first-of-type{border-left:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--ink);font-weight:600}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
textarea.field{height:auto;min-height:72px;padding:8px 10px;resize:vertical}
.hint{font-size:12px;color:var(--faint)}
.formerr{color:var(--warn);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30}

.kindseg{height:36px;min-width:180px}
.kindseg label{display:flex;align-items:center;justify-content:center;padding:0 14px}
.kindseg.fin label:has(input:checked){background:var(--k-final-bg)}
.kindseg.fin label:has(input:checked) span{color:var(--k-final)}
.kindseg:not(.fin) label:has(input:checked){background:var(--k-draft-bg)}
.kindseg:not(.fin) label:has(input:checked) span{color:var(--k-draft)}
.pill.kd{color:var(--k-draft);background:var(--k-draft-bg)}
.pill.kf{color:var(--k-final);background:var(--k-final-bg)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
#tb-trash tr{cursor:default}
.yearbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.yearbar .yl{font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
.ychip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.ychip b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted)}
.ychip:hover{border-color:var(--tab-on)}
.ychip[aria-pressed="true"]{background:var(--tab-on);border-color:var(--tab-on);color:#fff}
.ychip[aria-pressed="true"] b{color:#fff;opacity:.85}
tr.openrow td{background:var(--tab-bg)}
tr.detrow > td{padding:0 10px 14px;background:var(--tab-bg)}
.cpanel{--kc:var(--k-draft);--kc-ink:#fff;background:var(--surface);border:1px solid var(--tile-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 20px rgba(18,60,90,.08)}
.cpanel.fin{--kc:var(--k-final)}
.cp-head{display:flex;align-items:center;gap:12px}
.cp-av{width:40px;height:40px;border-radius:12px;background:var(--kc);color:var(--kc-ink,#fff);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.cp-title{min-width:0;flex:1}
.cp-title h3{margin:0;font-size:17px}
.cp-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--tile-line);border:1px solid var(--tile-line);border-radius:10px;overflow:hidden}
.cp-stats > div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-stats small{font-size:11px;color:var(--muted);font-weight:600}
.cp-stats b{font-family:var(--mono);font-size:20px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-stats b.sm{font-size:13px;font-family:var(--sans);padding-top:5px}
.cp-stats em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:2px;font-weight:500}
.cp-stats > div:first-child b{color:var(--kc)}
.cp-years{display:flex;gap:6px}
.cp-y{flex:1;display:flex;flex-direction:column;gap:6px;border:1px solid var(--tile-line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;min-width:0}
.cp-y:hover{border-color:var(--kc)}
.cp-y.zero{opacity:.55}
.cp-yt{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.cp-yt small{font-size:12px;color:var(--muted);font-weight:600}
.cp-yt b{font-family:var(--mono);font-size:16px}

<script>

  const SNAP_DATE = '2026-11-19';   // 파일에 담긴 저장본 기준일
  const $ = id => document.getElementById(id);

  const won = n => (n==null||n==='')?'':Number(n).toLocaleString('ko-KR');
  const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
  const daysSince = s => { if(!s) return null; const d=new Date(s+'T00:00:00'); if(isNaN(d)) return null; return Math.round((today()-d)/86400000); };
  const fmtDate = s => s ? s.replaceAll('-','.') : '';

  function stageOf(s){

    else if(st.dbState==='loading' || (st.dbState==='ready' && !(st.sitesLoaded&&st.cosLoaded))) b='<div class="banner"><div><b>불러오는 중</b> · 저장된 현장·업체 목록을 가져오고 있습니다.</div></div>';

     $('cnt-cos').textContent=cos.length;

        : [d.code?('코드 '+d.code):'', d.region, d.ceo?('대표 '+d.ceo):'', d.phone].filter(Boolean).join(' · ');
      const when = t.deletedAt ? new Date(t.deletedAt) : null;
      const whenTxt = when && !isNaN(when) ? `${when.getFullYear()}.${String(when.getMonth()+1).padStart(2,'0')}.${String(when.getDate()).padStart(2,'0')} ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')}` : '';
      return `<tr data-tid="${esc(t.id)}">
        <td><span class="pill ${t.kind==='site'?'sent':t.kind==='issue'?'done':'none'}">${t.kind==='site'?'현장':t.kind==='issue'?'내역서':'업체'}</span></td>
        <td class="name">${esc(d.name)}</td>
        <td class="meta">${esc(info)}</td>
        <td class="num meta">${whenTxt}</td>
        <td><div class="rowbtns"><button class="btn sm" data-restore="${esc(t.id)}"${ok?'':' disabled'}>복원</button><button class="btn sm danger" data-purge="${esc(t.id)}"${ok?'':' disabled'}>영구 삭제</button></div></td>
      </tr>`;
    }).join('');
  }

  async function restoreItem(id, btn){
    const t = st.trash.find(x=>x.id===id); if(!t) return;
    const col = t.kind==='site' ? 'sites' : t.kind==='issue' ? 'issueManual' : 'companies';
    const d = Object.assign({}, t.data||{}); if(t.kind==='issue') delete d.name;
    if(t.kind==='co' && st.cos.some(c=>c.name===d.name)){ toast('같은 이름의 업체가 이미 목록에 있어 복원할 수 없습니다'); return; }
    btn.disabled = true;
    d.updatedAt = new Date().toISOString();
    const r = await write(()=>st.db.collection(col).doc(t.origId || st.db.collection(col).doc().id).set(d));
    if(r!==true){ toast(r); btn.disabled=false; return; }
    await write(()=>st.db.collection('trash').doc(id).delete());
    if(t.kind==='issue' && d.siteId && d.setStatus!==false){
      const pre = d.ty==='d'?'draft':'final';
      if(st.sites.some(x=>x.id===d.siteId)) await write(()=>st.db.collection('sites').doc(d.siteId).update({[pre+'Status']:'발송',[pre+'Date']:d.d,[pre+'Amount']:d.t??null,updatedAt:new Date().toISOString()}));
    }
    toast(`"${t.data&&t.data.name||d.name||''}"을(를) ${t.kind==='site'?'현장':t.kind==='issue'?'발행 기록':'업체'} 목록으로 복원했습니다`);
  }

  async function purgeItem(id, btn){
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent='한 번 더 누르면 영구 삭제'; setTimeout(()=>{ if(btn.isConnected){btn.classList.remove('armed');btn.textContent='영구 삭제';} },3500); return; }
    btn.disabled = true;
    const r = await write(()=>st.db.collection('trash').doc(id).delete());
    if(r!==true){ toast(r); btn.disabled=false; return; }
    toast('영구 삭제했습니다');
  }

  async function emptyTrash(btn){
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent=`${st.trash.length}건 모두 영구 삭제하려면 한 번 더`; setTimeout(()=>{ if(btn.isConnected){btn.classList.remove('armed');btn.textContent='휴지통 비우기';} },3500); return; }
    btn.disabled = true;
    for(const t of st.trash.slice()){ await write(()=>st.db.collection('trash').doc(t.id).delete()); }
    btn.classList.remove('armed'); btn.textContent='휴지통 비우기';
    toast('휴지통을 비웠습니다');
  }

  function renderStats(cos, sites, sample){
    const yearOf = d => (d && /^\d{4}/.test(d)) ? d.slice(0,4) : null;
    const nsite = x => String(x||'').replace(/아파트|[\s()（）_\-]/g,'');
    const byCo = {}; const years = new Set(); const noDate = {d:0,f:0}; const excl = {q:0,r:0,o:0};
    const get = n => byCo[n] || (byCo[n] = {name:n, d:{}, f:{}, dt:0, ft:0, items:{d:[],f:[]}});
    const seen = new Set();
    const add = (ty, co, site, date, item) => {
      const y = yearOf(date);
      if(!y){ noDate[ty]++; return; }
      const key = ty+'|'+co+'|'+nsite(site)+'|'+date;
      const r = get(co);
      r.items[ty].push(Object.assign({y, dup:seen.has(key)}, item));
      if(seen.has(key)) return;            // 같은 날 같은 현장의 1안·2안 등은 1건
      seen.add(key);
      r[ty][y]=(r[ty][y]||0)+1; r[ty+'t']++;
      if(st.kind===ty) years.add(y);
    };
    // 1) 발행 현황 기록
    st.logs.forEach(l=>{
      if(l.ty==='d'||l.ty==='f') add(l.ty, l.c||'(업체 미기재)', l.s, l.d, {date:l.d, site:l.s, scope:l.sc, staff:l.w, total:l.t, raw:l.sr, contact:l.p, src:'log'});
      else if(l.ty==='q') excl.q++; else if(l.ty==='r') excl.r++; else excl.o++;
    });
    // 2) 내역서 파일로 1건씩 등록한 기록
    st.manual.forEach(m=>{ if(m.ty==='d'||m.ty==='f') add(m.ty, m.c||'(업체 미기재)', m.s, m.d, {date:m.d, site:m.s, scope:m.sc||m.k, staff:'', total:m.t, raw:m.sr, file:m.file, src:'manual', id:m.id}); });
    const linked = new Set(st.manual.filter(m=>m.siteId).map(m=>m.siteId+'|'+m.ty));
    // 3) 현황판에서 직접 "발송" 처리한 현장 (위 기록과 겹치면 1건)
    sites.forEach(s=>{
      const n = s.company || '(업체 미지정)';
      if(linked.has(s.id+'|d') || linked.has(s.id+'|f')){ if(s.draftStatus==='발송' && !linked.has(s.id+'|d')) add('d', n, s.name, s.draftDate, {date:s.draftDate, site:s.name, total:s.draftAmount, raw:'현황판 입력', src:'site'}); if(s.finalStatus==='발송' && !linked.has(s.id+'|f')) add('f', n, s.name, s.finalDate, {date:s.finalDate, site:s.name, total:s.finalAmount, raw:'현황판 입력', src:'site'}); return; }
      if(s.draftStatus==='발송') add('d', n, s.name, s.draftDate, {date:s.draftDate, site:s.name, total:s.draftAmount, raw:'현황판 입력', src:'site'});
      if(s.finalStatus==='발송') add('f', n, s.name, s.finalDate, {date:s.finalDate, site:s.name, total:s.finalAmount, raw:'현황판 입력', src:'site'});
    });
    // 4) 검토 대시보드 → 구글시트 "초안본/최종본 발행" 기록 (같은 업체·같은 현장은 몇 번 나가도 초안 1건·최종 1건)
    {
      const have = new Set();
      st.logs.forEach(l=>{ if(l.ty==='d'||l.ty==='f') have.add(l.ty+'|'+nsiteKey(l.s)+'|'+yearOf(l.d)); });
      st.manual.forEach(m=>{ if(m.ty==='d'||m.ty==='f') have.add(m.ty+'|'+nsiteKey(m.s)+'|'+yearOf(m.d)); });
      sites.forEach(s=>{ if(s.draftStatus==='발송') have.add('d|'+nsiteKey(s.name)+'|'+yearOf(s.draftDate)); if(s.finalStatus==='발송') have.add('f|'+nsiteKey(s.name)+'|'+yearOf(s.finalDate)); });
      sheetGroups().forEach(g=>{
        if(have.has(g.k+'|'+nsiteKey(g.s)+'|'+yearOf(g.d))) return;   // 엑셀·파일·현황판에 이미 있는 현장은 또 세지 않음
        add(g.k, g.c, g.s, g.d, {date:g.d, site:g.s, scope:g.sc, staff:'', total:g.t, contact:g.p, raw:(g.k==='d'?'초안':'최종')+(g.n>1?' '+g.n+'회 발행':' 발행'), src:'sheet', times:g.n, last:g.last});
      });
    }
    const thisYear = String(new Date().getFullYear());
    for(let y=2023; y<=Number(thisYear); y++) years.add(String(y));   // 2023년부터 항상 표시
    sites.forEach(s=>{ if(s.contractDate && /^\d{4}/.test(s.contractDate)) years.add(s.contractDate.slice(0,4)); });
    const ys = [...years].sort();
    if(st.year===null) st.year = thisYear;
    if(st.year && !ys.includes(st.year)) st.year='';
    const yopts = ys.slice().reverse();
    $('f-year').innerHTML = '<option value="">전체 연도 (연도별 비교)</option>' + yopts.map(y=>`<option value="${y}"${y===st.year?' selected':''}>${y}년</option>`).join('');

    cos.forEach(c=>get(c.name));
    renderTop(Object.values(byCo), ys, nsite);
    const K = st.kind;
    const kName = K==='d' ? '초안본' : '최종본';
    const kCls = K==='d' ? 'dr' : 'fn';
    const kColor = K==='d' ? 'var(--k-draft)' : 'var(--k-final)';
    $('view-stats').querySelector('.kindseg').classList.toggle('fin', K==='f');
    const byYear = (r,y) => r[K][y]||0;
    const total = r => r[K+'t'];
    const cnt = r => st.year ? byYear(r,st.year) : total(r);
    const q = st.qs.trim().toLowerCase();
    let rows = Object.values(byCo).filter(r=>(!q || r.name.toLowerCase().includes(q)) && (!st.onlySent || cnt(r)>0));
    rows.sort((a,b)=> cnt(b)-cnt(a) || a.name.localeCompare(b.name,'ko'));

    const all = Object.values(byCo);
    const tot = all.reduce((t,r)=>t+cnt(r),0);
    const activeCos = all.filter(r=>cnt(r)>0).length;
    const lines = all.reduce((t,r)=>t+r.items[K].filter(i=>!st.year||i.y===st.year).length,0);
    $('stats-sum').innerHTML = ''
      + (noDate[K]?`<span style="color:var(--warn)">발송일 없는 ${noDate[K]}건 제외</span>`:'')
      + (sample?'<span class="pill ex">예시 데이터</span>':'');

    renderStatsViz(all, ys, K, kName, kColor);
    const cell = (v,gl) => `<td class="c ${v?kCls:'zero'}${gl?' gl':''}">${v||'0'}</td>`;
    const tbl = $('tbl-stats');
    const exNote = [excl.q?`물량산출만 ${excl.q}줄`:'', excl.r?`2026년 발송여부 미기입 요청 ${excl.r}줄`:'', excl.o?`구분 불명 ${excl.o}줄`:''].filter(Boolean).join(', ');
    $('stats-note').textContent = `발행 현황 엑셀(2023~2024년), 잔디 「컨설팅 내역서 작성 및 검토 요청」 기록(2025년~2026년 10월: 같은 현장은 1차·2차·수정본을 묶어 1건, 2안·3안은 따로), 내역서 파일 등록, 현황판에서 "발송"으로 바꾼 현장, 검토 대시보드의 초안본·최종본 발행 기록(구글시트)을 합쳐 셉니다. 검토 대시보드 기록은 같은 업체·같은 현장이면 몇 번 다시 나가도 초안 1건·최종 1건으로, 첫 발행일 기준으로 셉니다. 같은 날 같은 업체에 같은 현장으로 보낸 1안·2안은 1건으로 셉니다. 업체명을 누르면 발행 기록을 볼 수 있습니다.` + (exNote?` 제외: ${exNote}.`:'');
    if(!rows.length){
      tbl.innerHTML = `<tbody><tr><td class="empty">${st.onlySent?`이 기간에 송부한 ${kName}이 없습니다.`:'조건에 맞는 업체가 없습니다.'}</td></tr></tbody>`;
      return;
    }
    const oc = st.openCo && byCo[st.openCo];
    let detailHtml = '';
    if(oc){
      const allIts = oc.items[K].filter(i=>!st.year||i.y===st.year).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      const cq = (st.cq||'').trim().toLowerCase();
      const its = cq ? allIts.filter(i=>[i.site,i.scope,i.staff,i.contact,i.raw].join(' ').toLowerCase().includes(cq)) : allIts;
      const real = allIts.filter(i=>!i.dup);
      const siteN = new Set(real.map(i=>nsite(i.site))).size;
      const amt = real.reduce((t,i)=>t+(Number(i.total)||0),0);
      const dates = real.map(i=>i.date).filter(Boolean).sort();
      const info = st.cos.find(c=>c.name===oc.name);
      const meta = info ? [info.code?'코드 '+info.code:'', info.region, info.ceo?'대표 '+info.ceo:'', info.phone, info.email].filter(Boolean) : [];
      const staffTop = Object.entries(real.reduce((m,i)=>{ if(i.staff) m[i.staff]=(m[i.staff]||0)+1; return m; },{})).sort((a,b)=>b[1]-a[1]).slice(0,3);
      // 전체 연도일 때 연도별 건수 막대
      let yearStrip = '';
      if(!st.year){
        const yc = {}; real.forEach(i=>{ yc[i.y]=(yc[i.y]||0)+1; });
        const ysx = ys.filter(y=>y>='2023'); const mx = Math.max(1,...ysx.map(y=>yc[y]||0));
        yearStrip = `<div class="cp-years">${ysx.map(y=>`<button class="cp-y${yc[y]?'':' zero'}" data-cpyear="${y}" title="${y}년으로 보기"><span class="cp-yt"><small>${y}년</small><b>${yc[y]||0}<em>건</em></b></span><span class="cp-yb"><i style="width:${(yc[y]||0)/mx*100}%"></i></span></button>`).join('')}</div>`;
      }
      const wd = d => { const t=new Date(d+'T00:00:00'); return isNaN(t)?'':'일월화수목금토'[t.getDay()]; };
      const groups = []; its.forEach(i=>{ const k=(i.date||'').slice(0,7)||'날짜 없음'; let g=groups[groups.length-1]; if(!g||g.k!==k){ g={k,items:[]}; groups.push(g);} g.items.push(i); });
      const item = i => `<li class="cp-it${i.dup?' dup':''}">
          <div class="cp-date"><b>${(i.date||'').slice(8,10)||'—'}</b><small>${wd(i.date)}</small></div>
          <div class="cp-main"><div class="cp-site">${esc(i.site)}${i.dup?'<span class="cp-tag">같은 날 추가안</span>':''}${i.src==='manual'?'<span class="cp-tag file">파일 등록</span>':''}${i.src==='sheet'?`<span class="cp-tag gs">검토 대시보드${i.times>1?` · ${i.times}회`:''}</span>`:''}</div>
            ${i.scope?`<div class="cp-scope">${esc(i.scope)}</div>`:''}
            <div class="cp-sub">${i.contact?`<span>👤 ${esc(i.contact)}</span>`:''}${i.staff?`<span class="cp-staff">넷폼 ${esc(i.staff)}</span>`:''}${i.src==='manual'&&i.file?`<span>${esc(i.file)}</span>`:''}${i.src==='sheet'&&i.times>1&&i.last?`<span>마지막 발행 ${esc(fmtDate(i.last))}</span>`:''}</div></div>
          <div class="cp-right"><span class="pill ${K==='d'?'kd':'kf'}">${esc(i.raw||kName)}</span>${i.total?`<span class="cp-amt">${won(i.total)}<small>원</small></span>`:''}
            ${i.src==='manual'?`<button class="btn sm danger${st.armedDel===i.id?' armed':''}" data-delissue="${esc(i.id)}">${st.armedDel===i.id?'한 번 더 누르면 삭제':'삭제'}</button>`:''}</div>
        </li>`;
      detailHtml = `<div class="cpanel${K==='f'?' fin':''}">
        <div class="cp-head">
          <span class="cp-av">${esc((oc.name.replace(/^\(주\)|^㈜|^주식회사\s*/,'')||'?').slice(0,1))}</span>
          <div class="cp-title"><h3>${esc(oc.name)}</h3><div class="cp-meta">${meta.length?meta.map(esc).join(' · '):(oc.name.startsWith('(')||oc.name.startsWith('넷폼')?'내부·미기재 구분':'협력업체 목록에 없는 업체')}</div></div>
          <button class="btn sm" data-logco="${esc(oc.name)}">닫기 ✕</button>
        </div>
        <div class="cp-stats">
          <div><small>${st.year?st.year+'년':'전체 기간'} ${kName}</small><b>${real.length}<em>건</em></b></div>
          <div><small>현장 수</small><b>${siteN}<em>곳</em></b></div>
          <div><small>첫 발행 ~ 최근 발행</small><b class="sm">${dates.length?fmtDate(dates[0])+' ~ '+fmtDate(dates[dates.length-1]):'—'}</b></div>
          <div><small>금액 합계</small><b class="sm">${amt?won(amt)+'원':'—'}</b></div>
          <div><small>넷폼 담당</small><b class="sm">${staffTop.length?staffTop.map(([n,c])=>esc(n)+' '+c).join(', '):'—'}</b></div>
        </div>
        ${yearStrip}
        <div class="cp-tools"><input class="field" id="cq" type="search" placeholder="이 업체 기록에서 현장·공사범위 검색" value="${esc(st.cq||'')}"><span class="meta">${its.length}줄${cq?` / ${allIts.length}줄`:''}</span></div>
        ${groups.length ? groups.map(g=>`<div class="cp-grp"><div class="cp-gh"><b>${g.k==='날짜 없음'?g.k:g.k.slice(0,4)+'년 '+Number(g.k.slice(5,7))+'월'}</b><span>${g.items.filter(i=>!i.dup).length}건</span></div><ul class="cp-list">${g.items.map(item).join('')}</ul></div>`).join('')
          : `<div class="empty">${cq?'검색에 맞는 기록이 없습니다.':'이 조건의 발행 기록이 없습니다.'}</div>`}
      </div>`;
    }
    const nc = st.year ? 3 : ((ys.length||1)+2);
    const after = r => (oc && r.name===oc.name) ? `<tr class="detrow"><td colspan="${nc}">${detailHtml}</td></tr>` : '';
    const nameCell = r => `<td><button class="linkbtn" data-logco="${esc(r.name)}" aria-expanded="${st.openCo===r.name}">${st.openCo===r.name?'▾ ':'▸ '}${esc(r.name)}</button></td>`;
    if(st.year){
      const max = Math.max(1, ...rows.map(cnt));
      tbl.innerHTML = `<thead><tr><th>업체명</th><th class="c">${kName} 송부</th><th style="width:45%"></th></tr></thead><tbody>`
        + rows.map(r=>`<tr${oc&&r.name===oc.name?' class="openrow"':''}>${nameCell(r)}${cell(cnt(r))}<td><i class="bar2" style="width:${cnt(r)/max*100}%;background:${kColor}"></i></td></tr>`+after(r)).join('')
        + `<tr class="total"><td>합계 (${rows.length}곳)</td>${cell(rows.reduce((t,r)=>t+cnt(r),0))}<td></td></tr></tbody>`;
    } else {
      const cols = ys.length ? ys : [thisYear];
      tbl.innerHTML = `<thead><tr><th>업체명</th>${cols.map(y=>`<th class="c gl">${y}년</th>`).join('')}<th class="c gl">합계</th></tr></thead><tbody>`
        + rows.map(r=>`<tr${oc&&r.name===oc.name?' class="openrow"':''}>${nameCell(r)}${cols.map(y=>cell(byYear(r,y),1)).join('')}${cell(total(r),1)}</tr>`+after(r)).join('')
        + `<tr class="total"><td>합계 (${rows.length}곳)</td>${cols.map(y=>cell(rows.reduce((t,r)=>t+byYear(r,y),0),1)).join('')}${cell(rows.reduce((t,r)=>t+total(r),0),1)}</tr></tbody>`;
    }
  }

  function renderTop(all, ys, nsite){
    const Y = st.year || '';
    const sum = (ty,y) => all.reduce((t,r)=>t+(y?(r[ty][y]||0):r[ty+'t']),0);
    // 송부연도 칩
    const yl = ys.slice().reverse().filter(y=>sum('d',y)+sum('f',y)>0 || y===Y);
    $('yearbar').innerHTML = '<span class="yl">송부연도</span>'
      + `<button class="ychip" data-y="" aria-pressed="${!Y}">전체 <b><span class="yd">초안 ${sum('d','')}</span> · <span class="yf">최종 ${sum('f','')}</span></b></button>`
      + yl.map(y=>`<button class="ychip" data-y="${y}" aria-pressed="${Y===y}">${y}년 <b><span class="yd">초안 ${sum('d',y)}</span> · <span class="yf">최종 ${sum('f',y)}</span></b></button>`).join('');
    const info = ty => {
      const its = []; all.forEach(r=>r.items[ty].forEach(i=>{ if(!i.dup && (!Y||i.y===Y)) its.push(Object.assign({co:r.name},i)); }));
      return { n: sum(ty,Y), cos: new Set(its.map(i=>i.co)).size, sites: new Set(its.map(i=>i.co+'|'+nsite(i.site))).size, last: its.map(i=>i.date).filter(Boolean).sort().pop()||'' };
    };
    const d = info('d'), f = info('f');
    const tot = d.n + f.n;
    const allCos = new Set(); all.forEach(r=>{ if(Y ? ((r.d[Y]||0)+(r.f[Y]||0)) : (r.dt+r.ft)) allCos.add(r.name); });
    const pct = v => tot ? Math.round(v/tot*100) : 0;
    const yLab = Y ? Y+'년 ' : '전체 기간 ';
    const lastAll = [d.last,f.last].filter(Boolean).sort().pop()||'';
    const onStats = st.tab==='stats';
    $('tiles').className = 'tiles k3';
    $('tiles').innerHTML = `
      <button class="tile t-all" data-kt="" title="연도별 송부 탭에서 보기">
        <span class="lab">${yLab}내역서 송부</span>
        <span class="val">${tot}<small>건</small></span>
        <span class="meter"><b style="width:100%"></b></span>
        <span class="sub">협력업체 ${allCos.size}곳</span></button>
      <button class="tile kt kd${onStats&&st.kind==='d'?' on':''}" data-kt="d" title="누르면 초안본 송부 현황을 봅니다">
        <span class="lab">초안본 송부<i>${pct(d.n)}%</i></span>
        <span class="val">${d.n}<small>건</small></span>
        <span class="meter"><b style="width:${pct(d.n)}%"></b></span>
        <span class="sub">협력업체 ${d.cos}곳 · 현장 ${d.sites}곳</span></button>
      <button class="tile kt kf${onStats&&st.kind==='f'?' on':''}" data-kt="f" title="누르면 최종본 송부 현황을 봅니다">
        <span class="lab">최종본 송부<i>${pct(f.n)}%</i></span>
        <span class="val">${f.n}<small>건</small></span>
        <span class="meter"><b style="width:${pct(f.n)}%"></b></span>
        <span class="sub">협력업체 ${f.cos}곳 · 현장 ${f.sites}곳</span></button>`;
    $('pipe').innerHTML = tot ? `<div style="width:${d.n/tot*100}%;background:var(--k-draft)" title="초안본 ${d.n}건"></div><div style="width:${f.n/tot*100}%;background:var(--k-final)" title="최종본 ${f.n}건"></div>` : '';
    $('legend').innerHTML = `<span><span class="dot kd-dot"></span>초안본 <b class="num">${d.n}</b>건 (${pct(d.n)}%)</span><span><span class="dot kf-dot"></span>최종본 <b class="num">${f.n}</b>건 (${pct(f.n)}%)</span><span>· 같은 날 같은 현장의 1안·2안은 1건으로 셈</span>`;
  }

  function renderStatsViz(all, ys, K, kName, kColor){
    const box = $('stats-viz');
    box.style.setProperty('--kc', kColor);
    const Y = st.year;
    // 중복(같은 날 추가안) 제외한 실제 송부 건
    const items = []; all.forEach(r=>r.items[K].forEach(i=>{ if(!i.dup && (!Y || i.y===Y)) items.push(Object.assign({co:r.name}, i)); }));
    const total = items.length;
    const coCount = {}; items.forEach(i=>{ coCount[i.co]=(coCount[i.co]||0)+1; });
    const top = Object.entries(coCount).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'ko')).slice(0,5);
    // 막대: 연도 선택 → 월별 12칸, 전체 → 연도별
    let bars;
    if(Y){ bars = Array.from({length:12},(_,m)=>({lab:(m+1)+'월', key:Y+'-'+String(m+1).padStart(2,'0'), v:0})); items.forEach(i=>{ const m=Number((i.date||'').slice(5,7)); if(m>=1&&m<=12) bars[m-1].v++; }); }
    else { bars = ys.map(y=>({lab:y+'년', key:y, v:0})); items.forEach(i=>{ const b=bars.find(x=>x.key===i.y); if(b) b.v++; }); }
    const now = new Date(); const curYM = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const active = bars.filter(b=>b.v>0);
    const avg = active.length ? total/active.length : 0;
    const best = bars.reduce((a,b)=>b.v>a.v?b:a, {v:-1,lab:'—'});
    const totalAmt = items.reduce((t,i)=>t+(Number(i.total)||0),0);

    const kpis = `<div class="kpis">
      <div class="kpi hero"><span class="k">${Y?Y+'년':'전체 기간'} ${kName} 송부</span><span class="v">${total.toLocaleString('ko-KR')}<small>건</small></span><span class="d">발행 기록 ${all.reduce((t,r)=>t+r.items[K].filter(i=>!Y||i.y===Y).length,0).toLocaleString('ko-KR')}줄 기준</span></div>
      <div class="kpi"><span class="k">송부한 업체</span><span class="v">${Object.keys(coCount).length}<small>곳</small></span><span class="d">업체당 평균 ${Object.keys(coCount).length?(total/Object.keys(coCount).length).toFixed(1):0}건</span></div>
      <div class="kpi"><span class="k">${Y?'월평균':'연평균'}</span><span class="v">${avg.toFixed(1)}<small>건</small></span><span class="d">${Y?`송부가 있었던 ${active.length}개월 기준`:`송부가 있었던 ${active.length}개 연도 기준`}</span></div>
      <div class="kpi"><span class="k">가장 많이 보낸 ${Y?'달':'해'}</span><span class="v txt">${best.v>0?esc(best.lab)+` · ${best.v}건`:'—'}</span><span class="d">내역서 금액 합계 ${totalAmt?Math.round(totalAmt/1e8).toLocaleString('ko-KR')+'억 원':'—'}</span></div>
    </div>`;

    // SVG 막대그래프
    const W=640, H=210, L=28, R=8, T=18, B=26, iw=W-L-R, ih=H-T-B;
    const maxV = Math.max(1, ...bars.map(b=>b.v));
    const raw = maxV/4, mag = Math.pow(10, Math.floor(Math.log10(Math.max(raw,1))));
    const step = Math.max(1, [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw) || 10*mag);
    const top1 = Math.ceil(maxV/step)*step;
    const yS = v => T + ih - (v/top1)*ih;
    const bw = iw/bars.length; const barW = Math.min(38, bw*0.62);
    let g = '';
    for(let t=0;t<=top1;t+=step){ g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${yS(t)}" y2="${yS(t)}"/><text class="axis" x="${L-6}" y="${yS(t)+4}" text-anchor="end">${t}</text>`; }
    const bestIdx = bars.indexOf(best);
    bars.forEach((b,i)=>{
      const cx = L + bw*i + bw/2, x = cx-barW/2, y = yS(b.v), h = Math.max(0, T+ih-y);
      const r = Math.min(4, h/2, barW/2);
      const path = h>0 ? `M${x},${T+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+barW-r} Q${x+barW},${y} ${x+barW},${y+r} V${T+ih} Z` : '';
      const sel = Y ? (st.month && b.key===Y+'-'+st.month) : false;
      g += `<g data-i="${i}" class="${sel?'sel':''}${st.month&&Y&&!sel?' dim':''}" tabindex="0" role="button" aria-label="${esc(b.lab)} ${b.v}건 ${Y?'현장 목록 보기':'연도 보기'}"><rect class="hit" x="${L+bw*i}" y="${T}" width="${bw}" height="${ih}"/>${h>0?`<path class="bar" d="${path}"/>`:`<rect class="bar zero" x="${x}" y="${T+ih-2}" width="${barW}" height="2" rx="1"/>`}</g>`;
      g += `<text class="axis" x="${cx}" y="${H-8}" text-anchor="middle">${esc(b.lab)}</text>`;
      if(b.v>0) g += `<text class="vlab${i===bestIdx?' best':''}" x="${cx}" y="${y-6}" text-anchor="middle">${b.v}</text>`;
    });
    if(avg>0){ g += `<line class="avg" x1="${L}" x2="${W-R}" y1="${yS(avg)}" y2="${yS(avg)}"/>`; }
    const chips = Y ? `<div class="mchips" role="group" aria-label="월 선택">`
        + bars.map((b,i)=>`<button class="mchip${st.month===String(i+1).padStart(2,'0')?' on':''}" data-month="${String(i+1).padStart(2,'0')}"${b.v?'':' disabled'}>${i+1}월<b>${b.v}</b></button>`).join('')
        + `</div>` : '';
    const chart = `<div class="card mchart"><h4>${Y?Y+'년 월별':'연도별'} ${kName} 송부 <span>${avg>0?`<i class="avgkey"></i>평균 ${avg.toFixed(1)}건 · `:''}${Y?'막대나 아래 월을 누르면 그 달 현장 목록':'막대를 누르면 그 해로 이동'}</span></h4>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${Y?Y+'년 월별':'연도별'} ${kName} 송부 건수">${g}</svg><div class="vtip" hidden></div>${chips}</div>`;

    const maxTop = top.length ? top[0][1] : 1;
    const rank = `<div class="card"><h4>${kName} 많이 보낸 업체 <span>TOP ${top.length||5}</span></h4><ol class="rank">`
      + (top.length ? top.map(([n,v],i)=>`<li><span class="no">${i+1}</span><button class="nm" data-logco="${esc(n)}" title="${esc(n)} 발행 기록 보기">${esc(n)}</button><span class="ct">${v}<small>${total?Math.round(v/total*100):0}%</small></span><span class="rb"><i style="width:${v/maxTop*100}%"></i></span></li>`).join('')
         : '<li class="empty meta">이 기간의 송부 기록이 없습니다.</li>')
      + `</ol></div>`;
    let monthPanel = '';
    if(Y && st.month){
      const mItems = []; all.forEach(r=>r.items[K].forEach(i=>{ if(i.y===Y && (i.date||'').slice(5,7)===st.month) mItems.push(Object.assign({co:r.name}, i)); }));
      mItems.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || a.co.localeCompare(b.co,'ko'));
      const q = (st.mq||'').trim().toLowerCase();
      const shown = q ? mItems.filter(i=>[i.site,i.co,i.scope,i.staff,i.contact].join(' ').toLowerCase().includes(q)) : mItems;
      const realN = mItems.filter(i=>!i.dup).length;
      const amt = mItems.filter(i=>!i.dup).reduce((t,i)=>t+(Number(i.total)||0),0);
      const cos = new Set(mItems.filter(i=>!i.dup).map(i=>i.co)).size;
      const mNo = Number(st.month);
      monthPanel = `<div class="card mpanel" id="mpanel">
        <div class="mphead">
          <button class="btn sm" data-mstep="-1"${mNo<=1?' disabled':''} aria-label="이전 달">‹</button>
          <h4>${Y}년 ${mNo}월 ${kName} 송부 현장</h4>
          <button class="btn sm" data-mstep="1"${mNo>=12?' disabled':''} aria-label="다음 달">›</button>
          <span class="mpsum"><b>${realN}</b>건 · 업체 <b>${cos}</b>곳${amt?` · 금액 합계 <b>${won(amt)}</b>원`:''}</span>
          <input class="field mpq" id="mq" type="search" placeholder="현장·업체 검색" value="${esc(st.mq||'')}">
          <button class="btn sm" data-mclose="1">닫기</button>
        </div>
        <div class="tablewrap"><table class="dtbl"><thead><tr><th>날짜</th><th>현장명</th><th>업체</th><th>공사범위</th><th>넷폼 담당</th><th class="r">총 합계</th><th>발송여부</th></tr></thead><tbody>`
        + (shown.length ? shown.map(i=>`<tr${i.dup?' class="dupr"':''}><td class="num">${fmtDate(i.date).slice(5)}</td><td><b>${esc(i.site)}</b>${i.contact?`<div class="meta">${esc(i.contact)}</div>`:''}</td><td><button class="linkbtn" data-logco="${esc(i.co)}">${esc(i.co)}</button></td><td class="meta" style="max-width:320px">${esc(i.scope||'')}</td><td>${esc(i.staff||'')}</td><td class="r num">${i.total?won(i.total):'<span class="meta">—</span>'}</td><td><span class="pill ${K==='d'?'kd':'kf'}">${esc(i.raw||kName)}</span>${i.dup?' <span class="meta">같은 날 추가안</span>':''}</td></tr>`).join('')
           : `<tr><td colspan="7" class="empty">${q?'검색에 맞는 현장이 없습니다.':'이 달에 송부한 기록이 없습니다.'}</td></tr>`)
        + `</tbody></table></div></div>`;
    }
    // 연도별 · 월별 표 (초안본/최종본 같이)
    const YM = {}; const ymYears = ys.slice().reverse();
    all.forEach(r=>['d','f'].forEach(k=>r.items[k].forEach(i=>{ if(i.dup||!i.y) return; const mm=Number((i.date||'').slice(5,7)); if(!(mm>=1&&mm<=12)) return; const c=(YM[i.y]=YM[i.y]||{d:Array(13).fill(0),f:Array(13).fill(0)}); c[k][mm]++; c[k][0]++; })));
    const ymCell = (y,mm) => { const c=YM[y]; const d=c?c.d[mm]:0, f=c?c.f[mm]:0; if(!d&&!f) return `<td class="ymc zero">·</td>`;
      return `<td class="ymc${y===Y&&String(mm).padStart(2,'0')===st.month?' on':''}"${mm?` data-ym="${y}|${String(mm).padStart(2,'0')}" title="${y}년 ${mm}월 보기"`:''}><span class="ymd">${d}</span><span class="ymf">${f}</span></td>`; };
    const ymTable = `<div class="card ymcard"><h4>연도별 · 월별 송부 <span><i class="ymkey ymd"></i>초안본 <i class="ymkey ymf"></i>최종본 · 칸을 누르면 그 달 현장 목록</span></h4>
      <div class="tablewrap"><table class="ymtbl"><thead><tr><th>연도</th>${Array.from({length:12},(_,i)=>`<th class="c">${i+1}월</th>`).join('')}<th class="c">합계</th></tr></thead><tbody>`
      + ymYears.map(y=>`<tr><th class="yh">${y}년</th>${Array.from({length:12},(_,i)=>ymCell(y,i+1)).join('')}${ymCell(y,0).replace('class="ymc','class="ymc ymt')}</tr>`).join('')
      + `</tbody></table></div><p class="hint" style="margin:6px 0 0">2023~2024년은 발행 현황 엑셀, 2025년~2026년 10월은 잔디 검토요청방, 2026년 10월부터는 검토 대시보드(구글시트) 기록입니다.</p></div>`;
    // 전체 연도일 때: 월별로 연도끼리 비교 (꺾은선)
    let cmp = '';
    if(!Y){
      const cy = ys.filter(y=>YM[y] && YM[y][K][0]>0);
      const PAL = ['#E2E8F0','#CBD5E1','#F59E0B','#94A3B8','#0F172A','#2563EB'];   // 오래된 해 → 연한 색, 작년 → 진한 남색, 올해 → 파랑
      const col = y => PAL[PAL.length-(cy.length-cy.indexOf(y))] || '#CBD5E1';
      const W2=760, H2=250, L=34, R=12, T=16, B=28;
      const vmax = Math.max(5, ...cy.map(y=>Math.max(...YM[y][K].slice(1))));
      const step = vmax<=20?5:vmax<=50?10:vmax<=100?20:50; const top2 = Math.ceil(vmax/step)*step;
      const xs = m => L + (W2-L-R)*(m-1)/11, yv = v => T + (H2-T-B)*(1-v/top2);
      let g2 = '';
      for(let v=0; v<=top2; v+=step) g2 += `<line class="grid" x1="${L}" x2="${W2-R}" y1="${yv(v)}" y2="${yv(v)}"/><text class="axis" x="${L-6}" y="${yv(v)+4}" text-anchor="end">${v}</text>`;
      for(let m=1;m<=12;m++) g2 += `<text class="axis" x="${xs(m)}" y="${H2-8}" text-anchor="middle">${m}월</text>`;
      const nowY = String(new Date().getFullYear()), nowM = new Date().getMonth()+1;
      cy.forEach(y=>{
        const last = y===nowY ? nowM : 12;
        const pts = Array.from({length:last},(_,i)=>[xs(i+1), yv(YM[y][K][i+1]), YM[y][K][i+1], i+1]);
        g2 += `<polyline fill="none" stroke="${col(y)}" stroke-width="${y===nowY?3:2}" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
        g2 += pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${col(y)}" stroke="var(--surface)" stroke-width="1.5" style="cursor:pointer" data-ym="${y}|${String(p[3]).padStart(2,'0')}"><title>${y}년 ${p[3]}월 · ${kName} ${p[2]}건</title></circle>`).join('');
      });
      const legend2 = cy.map(y=>`<span class="cmpkey"><i style="background:${col(y)}"></i>${y}년 <b>${YM[y][K][0]}</b></span>`).join('');
      const head = `<tr><th>월</th>${cy.map(y=>`<th class="c">${y}년</th>`).join('')}<th class="c">월 평균</th></tr>`;
      const ymax = Math.max(...cy.map(y=>YM[y][K][0])); const full = cy.filter(y=>YM[y][K][0] >= ymax*0.3);   // 기록이 적게 남은 해(예: 2023년 초안)는 평균·전년대비에서 뺌
      const mAvg = m => { const vs = full.filter(y=>!(y===nowY && m>=nowM)).map(y=>YM[y][K][m]); return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0; };
      const avgAll = Array.from({length:12},(_,i)=>mAvg(i+1)); const avgMean = avgAll.reduce((a,b)=>a+b,0)/12;
      const body = Array.from({length:12},(_,i)=>`<tr><th class="yh">${i+1}월</th>${cy.map(y=>{ const v=YM[y][K][i+1]; const fi=full.indexOf(y); const prev=fi>0?YM[full[fi-1]][K][i+1]:null; const diff=(prev!=null&&(v||prev))?v-prev:null; return `<td class="c ymc${v?'':' zero'}"${v?` data-ym="${y}|${String(i+1).padStart(2,'0')}"`:''}>${v||'·'}${diff!=null&&v?`<small class="${diff>0?'up':diff<0?'dn':''}">${diff>0?'▲'+diff:diff<0?'▼'+(-diff):'–'}</small>`:''}</td>`; }).join('')}<td class="c ymc ymt avgc${avgAll[i]<avgMean*0.8?' low':avgAll[i]>avgMean*1.2?' high':''}">${avgAll[i].toFixed(1)}<small>${avgAll[i]<avgMean*0.8?'적은 달':avgAll[i]>avgMean*1.2?'많은 달':''}</small></td></tr>`).join('');
      cmp = `<div class="card mchart cmpcard"><h4>월별 ${kName} 송부 · 연도 비교 <span>점이나 표 칸을 누르면 그 달 현장 목록 · ▲▼ 는 전년 같은 달 대비 · 월 평균이 전체 평균보다 20% 이상 적거나 많으면 표시 · 이번 달과 기록이 적은 해는 평균에서 뺌</span></h4>
        <div class="cmplegend">${legend2}</div>
        <svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="월별 ${kName} 송부 연도 비교">${g2}</svg>
        <div class="tablewrap" style="margin-top:8px"><table class="ymtbl cmptbl"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
    }
    box.innerHTML = kpis + `<div class="vizrow">${chart}${rank}</div>` + cmp + monthPanel + ymTable;
    box.querySelectorAll('[data-ym]').forEach(td=>td.addEventListener('click',()=>{ const [y,mm]=td.dataset.ym.split('|'); st.year=y; st.month=mm; st.mq=''; render(); const mp=$('mpanel'); mp && mp.scrollIntoView({block:'nearest', behavior:'smooth'}); }));
    // 월 선택
    const pick = m => { st.month = (st.month===m) ? '' : m; st.mq=''; render(); if(st.month){ const mp=$('mpanel'); mp && mp.scrollIntoView({block:'nearest', behavior:'smooth'}); } };
    box.querySelectorAll('[data-month]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.month)));
    box.querySelectorAll('g[data-i]').forEach(el=>{
      const go = ()=>{ const b=bars[+el.dataset.i]; if(Y){ if(b.v) pick(b.key.slice(5,7)); } else { st.year=b.key; st.month=''; render(); } };
      el.addEventListener('click', go); el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    });
    box.querySelectorAll('[data-mstep]').forEach(b=>b.addEventListener('click',()=>{ const n=Number(st.month)+Number(b.dataset.mstep); if(n>=1&&n<=12){ st.month=String(n).padStart(2,'0'); render(); } }));
    const mc = box.querySelector('[data-mclose]'); if(mc) mc.addEventListener('click',()=>{ st.month=''; render(); });
    const mq = $('mq'); if(mq){ mq.addEventListener('input',e=>{ st.mq=e.target.value; const pos=e.target.selectionStart; render(); const n=$('mq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }); }
    // 툴팁
    const svg = box.querySelector('svg'), tip = box.querySelector('.vtip'), card = box.querySelector('.mchart');
    svg.querySelectorAll('g[data-i]').forEach(el=>{
      const b = bars[+el.dataset.i];
      el.addEventListener('mouseenter',()=>{ el.classList.add('on'); tip.hidden=false; tip.innerHTML=`${esc(b.lab)} · <b>${b.v}</b>건`;
        const rc=card.getBoundingClientRect(), hr=el.querySelector('.hit').getBoundingClientRect(), br=el.querySelector('.bar').getBoundingClientRect();
        tip.style.left=(hr.left+hr.width/2-rc.left)+'px'; tip.style.top=(br.top-rc.top-6)+'px'; });
      el.addEventListener('mouseleave',()=>{ el.classList.remove('on'); tip.hidden=true; });
    });
  }

  function matchStage(s){
    const k=stageOf(s);
    if(!st.stage) return true;
    if(st.stage==='wait_draft') return k==='none'||k==='draft_wip';
    if(st.stage==='wait_final') return k==='draft_sent'||k==='final_wip';
    if(st.stage==='late') return k==='draft_sent' && (daysSince(s.draftDate)||0)>=LATE_DAYS;
    return k===st.stage;
  }

  function docCell(status, date, amount){
    const cls = status==='발송'?'sent':status==='작성중'?'wip':'none';
    return `<div class="docstate"><span class="pill ${cls}">${esc(status||'미작성')}</span>${date?`<span class="d">${fmtDate(date)}</span>`:''}${amount?`<span class="d">${won(amount)}원</span>`:''}</div>`;
  }

  function renderSites(sites, sample){
    const q=st.q.trim().toLowerCase();
    let list = sites.filter(s=>{
      if(st.company && s.company!==st.company) return false;
      if(!matchStage(s)) return false;
      if(q && ![s.name,s.company,s.companyRaw,s.region,s.method,s.memo,s.no].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    const by = {
      no:(a,b)=>(Number(b.no)||0)-(Number(a.no)||0) || (b.createdAt||'').localeCompare(a.createdAt||''),
      updated:(a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''),
      contract:(a,b)=>(b.contractDate||'').localeCompare(a.contractDate||''),
      name:(a,b)=>(a.name||'').localeCompare(b.name||'','ko'),
      wait:(a,b)=>{ const w=s=>stageOf(s)==='draft_sent'||stageOf(s)==='final_wip'?(daysSince(s.draftDate)??-1):-2; return w(b)-w(a); }
    }[st.sort];
    list = list.slice().sort(by);
    const chips = [];
    if(st.company) chips.push(`<span class="chipfilter">업체: ${esc(st.company)} <button data-clear="company" aria-label="업체 필터 해제">×</button></span>`);
    if(!list.length){
      $('tb-sites').innerHTML=`<tr><td colspan="7" class="empty">${sites.length?'조건에 맞는 현장이 없습니다.':'등록된 현장이 없습니다. 오른쪽 위 “+ 현장 등록”으로 추가하세요.'}</td></tr>`;
      return;
    }
    $('tb-sites').innerHTML = list.map(s=>{
      const k=stageOf(s), sg=STAGE[k];
      const wait = (k==='draft_sent'||k==='final_wip') ? daysSince(s.draftDate) : null;
      const waitPill = wait!=null && wait>=0 ? `<span class="pill ${wait>=LATE_DAYS?'late':'none'}" title="초안 발송 후 경과일">초안 후 D+${wait}</span>` : '';
      const step = STAGES.findIndex(x=>x.k===k);
      const mini = STAGES.slice(1).map((x,i)=>`<i style="${i<step?'background:'+STAGE[STAGES[step].k].color:''}"></i>`).join('');
      return `<tr data-id="${esc(s.id)}" class="${sample?'sample':''}" tabindex="${sample?-1:0}">
        <td><div class="name">${esc(s.name)} ${sample?'<span class="pill ex">예시</span>':''}</div><div class="meta">${esc([s.no?('No.'+s.no):'', s.region, s.method, s.startDate?('착공 '+fmtDate(s.startDate)):'', s.endDate?('준공 '+fmtDate(s.endDate)):''].filter(Boolean).join(' · '))}</div></td>
        <td>${s.company?`<button class="linkbtn" data-co="${esc(s.company)}">${esc(s.company)}</button>`:'<span class="meta">—</span>'}</td>
        <td class="num">${fmtDate(s.contractDate)||'<span class="meta">—</span>'}</td>
        <td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span class="pill ${sg.cls}">${sg.label}</span><div class="mini" aria-hidden="true">${mini}</div>${waitPill}</div></td>
        <td>${docCell(s.draftStatus,s.draftDate,s.draftAmount)}</td>
        <td>${docCell(s.finalStatus,s.finalDate,s.finalAmount)}</td>
        <td class="r num">${(s.totalExec||s.finalAmount)?won(s.totalExec||s.finalAmount):'<span class="meta">—</span>'}${s.contractAmount?`<div class="meta">계약 ${won(s.contractAmount)}</div>`:''}</td>
      </tr>`;
    }).join('') + (chips.length?'':'');
  }

  const num = v => { const n=String(v||'').replace(/[^\d]/g,''); return n?Number(n):null; };
  const radio = name => (document.querySelector(`input[name="${name}"]:checked`)||{}).value||'미작성';
  const showErr = (id,msg) => { const e=$(id); e.textContent=msg; e.hidden=!msg; };

  async function write(fn){
    try{ await fn(); return true; }
    catch(e){
      const code=e&&e.code;
      if(code==='unavailable'){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); try{ await fn(); return true; }catch(e2){} }
      if(code==='invalid_argument'){ st.readOnly=true; render(); return '이 계정에는 수정 권한이 없습니다.'; }
      if(code==='quota_exceeded') return '저장 공간이 가득 찼습니다. 필요 없는 항목을 지운 뒤 다시 시도하세요.';
      return '저장하지 못했습니다. 잠시 후 다시 시도하세요.';
    }
  }

  async function ensureCompany(name){
    if(!name || st.cos.some(c=>c.name===name)) return true;
    const now=new Date().toISOString();
    return write(()=>st.db.collection('companies').doc().set({name,contact:'',phone:'',email:'',memo:'',createdAt:now,updatedAt:now}));
  }

  async function saveSite(ev){
    ev.preventDefault();
    const name=$('sf-name').value.trim(), company=$('sf-company').value.trim();
    if(!name||!company){ showErr('sf-err','현장명과 협력업체를 입력하세요.'); return; }
    const prev = st.editing.id ? (st.sites.find(x=>x.id===st.editing.id)||{}) : {};
    const body = Object.assign({}, prev, {
      name, company,
      region:$('sf-region').value.trim(), method:$('sf-method').value.trim(),
      contractDate:$('sf-contract').value, receivedDate:$('sf-received').value,
      draftStatus:radio('sf-draft'), draftDate:$('sf-draft-date').value, draftAmount:num($('sf-draft-amt').value),
      finalStatus:radio('sf-final'), finalDate:$('sf-final-date').value, finalAmount:num($('sf-final-amt').value),
      startDate:$('sf-start').value.trim(), endDate:$('sf-end').value.trim(),
      totalExec:num($('sf-total').value), contractAmount:num($('sf-camt').value),
      memo:$('sf-memo').value.trim(), updatedAt:new Date().toISOString()
    });
    delete body.id;
    $('save-btn').disabled=true;
    const r1 = await ensureCompany(company);
    if(r1!==true){ showErr('sf-err',r1); $('save-btn').disabled=false; return; }
    const id = st.editing.id;
    const ref = id ? st.db.collection('sites').doc(id) : st.db.collection('sites').doc();
    if(!id) body.createdAt=body.updatedAt; else { const old=st.sites.find(x=>x.id===id); if(old&&old.createdAt) body.createdAt=old.createdAt; }
    const r = await write(()=>ref.set(body));
    if(r!==true){ showErr('sf-err',r); $('save-btn').disabled=false; return; }
    closeDrawer(); toast(id?'현장 정보를 저장했습니다':'현장을 등록했습니다');
  }

  async function saveCo(ev){
    ev.preventDefault();
    const name=$('cf-name').value.trim();
    if(!name){ showErr('cf-err','업체명을 입력하세요.'); return; }
    const {id,oldName}=st.editing;
    if(st.cos.some(c=>c.name===name && c.id!==id)){ showErr('cf-err','같은 이름의 업체가 이미 있습니다.'); return; }
    const now=new Date().toISOString();
    const v = k => $(k).value.trim();
    const old = id ? st.cos.find(c=>c.id===id) : null;

  /* ---------- 발행 현황 엑셀 올리기 ---------- */
  // 업체명 비교용: ㈜·공백 제거, "이앤씨/이엔씨", "ING/아이엔지"처럼 표기만 다른 것은 같게 봄
  const coreName = n => String(n||'').replace(/\(주\)|㈜|주식회사|주\)|\(주|\(유\)|유한회사|[\s()\[\]_.,·\-\u00a0]/g,'').toLowerCase().replace(/앤/g,'엔').replace(/ing/g,'아이엔지');
  function companyMatcher(){
    const reg = {}; st.cos.forEach(c=>{ reg[coreName(c.name)] = c.name; });
    const find = k => reg[k];
    const alias = {'진성이엔지':'㈜진성이앤지','삼정ing건설':'삼정아이엔지건설㈜','ms이앤지':'엠에스이앤지㈜','hd건설':'에이치디건설㈜','색체':'색채산업개발㈜','황윤선':'㈜석민이앤씨','아스퀘':'아파트스퀘어','아파트스퀘어':'아파트스퀘어','로토텍':'로토텍다이아몬드','에스피':'에스피플래닝','세원':'세원'};
    Object.keys(alias).forEach(k=>{ const v0=alias[k]; delete alias[k]; const v=Object.values(reg).find(n=>coreName(n)===coreName(v0)); alias[coreName(k)] = v||v0; });
    const keys = Object.keys(reg).sort((a,b)=>b.length-a.length);
    const BRANCH=['경남지사','김훈','조민준'], INTERNAL=['넷폼','pour솔루션','pour','솔루션','한준엽','한인규','이승우'];
    const person = /(과장|이사|대표|본부장|상무|전무|부장|대리|주임|소장|팀장|차장|매니저|사장)님?$/;
    const COWORD = /(건설|산업|개발|기업|엔지|이앤|씨앤|앤씨|엔씨|건축|종합|공사|테크|홀딩스|컨설팅|기술|솔루션|디앤|피앤|이엔|산건)/;
    return (co, contact) => {
      co = String(co||'').replace(/^\s*(최종본|최종|초안본|초안)\s+/,'');   // "최종본 기림"처럼 앞에 붙은 구분 표시는 떼고 봄
      for(const t of [co, contact]){ if(!t) continue; const c=coreName(t); if(reg[c]) return reg[c]; if(alias[c]) return alias[c]; }
      for(const t of [co, contact]){ if(!t) continue; const c=coreName(t);
        for(const k of keys){ if(k.length>=3 && c.includes(k)) return reg[k]; }
        for(const a in alias){ if(a.length>=3 && c.includes(a)) return alias[a]; } }
      const txt = ((co||'')+' '+(contact||'')).trim(); const c = coreName(txt);
      if(!txt) return '(업체 미기재)';
      if(BRANCH.some(k=>c.includes(k))) return '넷폼 경남지사';
      if(INTERNAL.some(k=>c.includes(k)) || /조재연/.test(c)) return '넷폼 본사(POUR솔루션)';
      if(/^hj/.test(c)) return find(coreName('㈜에이치제이건설')) || '㈜에이치제이건설';
      for(const a in alias){ if(c.startsWith(a)) return alias[a]; }
      // 업체명 뒤에 담당자 이름이 붙은 경우(예: "석민송길영") 앞부분이 한 업체로만 이어지면 그 업체로
      if(co){ const cc=coreName(co); for(let n=cc.length;n>=2;n--){ const cands=keys.filter(k=>k.startsWith(cc.slice(0,n))); if(cands.length===1 && (!COWORD.test(cc.slice(n)) || cands[0]===cc.slice(0,n))) return reg[cands[0]]; if(cands.length) break; } }
      const clean = t => String(t||'').replace(/\(주\)|㈜|주식회사|주\)|\(주/g,'').trim();
      const tok = clean(txt).split(/[\s_\u00a0]+/)[0]||''; const tc = coreName(tok);
      // "이재덕 전무"처럼 사람 이름과 직함만 있으면 업체를 알 수 없음 (단, "우인건설"처럼 업체 이름이면 그대로)
      if(!tok || /^[\d.]+$/.test(tok) || person.test(tok) || /^아파트$/.test(tok) || (person.test(txt) && /^[가-힣]{2,4}$/.test(tok) && !COWORD.test(tok) && !keys.some(k=>k.startsWith(tc)))) return '(업체 미기재)';
      if(co){ const parts = clean(co).split(/[\s_\u00a0]+/); return (parts.length>1 && person.test(parts.slice(1).join(''))) || (parts.length===2 && /^[가-힣]{2,4}$/.test(parts[1])) ? parts[0] : clean(co) ? co.trim() : '(업체 미기재)'; }
      const cands = keys.filter(k=>tc.length>=2 && k.startsWith(tc));
      if(cands.length===1) return reg[cands[0]];
      return tok;
    };
  }
  const sendType = v => { const s=String(v||'').replace(/\s/g,''); if(s.includes('최종')) return 'f'; if(s.includes('초안')) return 'd'; if(s.includes('물량')||s.includes('물랑')) return 'q'; return s?'o':''; };
  function cellDate(v, year){
    if(v==null || v==='') return '';
    if(typeof v==='number' && v>20000 && v<80000){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
    const t=String(v).trim();
    let m=t.match(/^(\d{4})[.\-\/]\s*(\d{1,2})[.\-\/]\s*(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    m=t.match(/^(\d{1,2})\/(\d{1,2})/); if(m && year) return `${year}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
    return '';
  }
  function parseWorkbook(wb, fileName){
    const match = companyMatcher(); const sheets=[];
    wb.SheetNames.forEach(name=>{
      const ws = wb.Sheets[name];
      // 서식만 있는 빈 칸 때문에 범위가 100만 줄로 잡히는 경우가 있어, 값이 있는 칸까지만 읽음
      let maxR=0, maxC=0;
      for(const k in ws){ if(k[0]==='!') continue; const c=ws[k]; if(c==null || c.v==null || c.v==='') continue; const a=XLSX.utils.decode_cell(k); if(a.r>maxR) maxR=a.r; if(a.c>maxC) maxC=a.c; }
      if(!maxR) return;
      let rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true, range:{s:{r:0,c:0}, e:{r:maxR, c:Math.min(maxC,60)}}});
      let h=-1; for(let i=0;i<Math.min(rows.length,12);i++){ const r=(rows[i]||[]).map(x=>String(x||'').replace(/\s/g,'')); if(r.includes('현장명') && r.some(x=>x.startsWith('발송여부'))){ h=i; break; } }
      if(h<0) return;
      const H=(rows[h]||[]).map(x=>String(x||'').replace(/\s/g,''));
      // 주황색으로 칠한 줄(구분선)이 있으면 그 위까지만 읽음
      const nCols = Math.max(4, H.filter(Boolean).length);
      const isOrange = rgb => { if(!rgb || rgb.length<6) return false; const hx=rgb.slice(-6); const R=parseInt(hx.slice(0,2),16)/255, G=parseInt(hx.slice(2,4),16)/255, B=parseInt(hx.slice(4,6),16)/255;
        const mx=Math.max(R,G,B), mn=Math.min(R,G,B); if(mx-mn<0.35 || R<0.8 || B>0.45) return false; const hue=60*((G-B)/(mx-mn)); return hue>=15 && hue<=50; };
      let stopAt = -1, stopRow = 0;
      for(let r=h+1; r<=maxR && stopAt<0; r++){ let k=0; for(let c=0;c<Math.min(maxC+1,40);c++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; if(cell && cell.s && cell.s.fgColor && isOrange(cell.s.fgColor.rgb)) k++; } if(k>=Math.max(4, Math.floor(nCols*0.6))){ stopAt=r; stopRow=r+1; } }
      if(stopAt>0) rows = rows.slice(0, stopAt);
      const idx = k => H.findIndex(x=>x===k);
      const all = k => H.map((x,i)=>x.startsWith(k)?i:-1).filter(i=>i>=0);
      const dam = all('담당자');
      const coI = idx('업체'), dateI = idx('견적일자');
      // 업체 바로 뒤의 "담당자" = 업체 담당자, 견적일자 뒤의 "담당자" = 넷폼 담당 (양식마다 칸 수가 달라서 위치로 구분)
      const contactI = dam.find(i=>coI>=0 && i>coI && (dateI<0 || i<dateI)) ?? -1;
      const staffI = dam.find(i=>dateI>=0 && i>dateI) ?? -1;
      const C = {brand:idx('브랜드'), site:idx('현장명'), co:coI, contact:contactI, region:idx('지역'), city:idx('도시'), scope:idx('공사범위'), date:dateI, staff:staffI, work:idx('공종별'), qty:all('물량'), price:all('단가'), total:H.findIndex(x=>x.includes('합계')), status:H.findIndex(x=>x.startsWith('발송여부'))};
      const title = [name, ...rows.slice(0,h).flat().map(x=>String(x||''))].join(' ');
      let year = (title.match(/20\d\d/)||[])[0] || '';
      const L=[]; let prevD='';
      rows.slice(h+1).forEach((r,j)=>{
        const g = i => (i>=0 && r[i]!=null) ? r[i] : null;
        const site = g(C.site); if(!site || !String(site).trim()) return;
        const rawDate = g(C.date); let d = cellDate(rawDate, year);
        const isDate = (typeof rawDate==='number' && rawDate>20000) || /^\d{4}[.\-\/]/.test(String(rawDate||''));
        let ty = sendType(g(C.status));
        if(!g(C.status) && !isDate) ty='r';
        // "2022-62-27"처럼 잘못 적힌 날짜는 바로 윗줄 날짜를 씀 (요청 목록 줄은 제외)
        let fixNote='';
        if(d && !/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d)) d='';
        if(!d && prevD && ty!=='r'){ fixNote = '날짜 오류: '+(String(rawDate||'').trim()||'(빈칸)')+' → 앞줄 날짜 사용'; d = prevD; }
        if(d && isDate) prevD = d;
        if(!year && d) year = d.slice(0,4);
        const tot = g(C.total);
        L.push({n:h+2+j, d, nd: !d, dr:fixNote || (isDate?'':String(rawDate||'')), s:String(site).trim(), c:match(String(g(C.co)||'').trim(), String(g(C.contact)||'').trim()),
          cr:String(g(C.co)||'').trim(), p:String(g(C.contact)||'').trim(), rg:String(g(C.region)||'').trim(), ct:String(g(C.city)||'').trim(),
          sc:String(g(C.scope)||'').trim().slice(0,300), w:String(g(C.staff)||'').trim(), k:String(g(C.work)||'').trim(),
          q:C.qty.map(i=>g(i)).filter(x=>x!=null&&x!=='').join(' / '), u:C.price.map(i=>g(i)).filter(x=>x!=null&&x!=='').join(' / '),
          t:typeof tot==='number'?Math.round(tot):null, ty, sr:String(g(C.status)||'').trim(), b:String(g(C.brand)||'').trim()});
      });
      if(!L.length) return;
      // 한 시트에 여러 해가 섞여 있으면(예: 2023~25년) 날짜 기준으로 연도별로 나눔
      const datedYears = new Set(L.filter(x=>x.d).map(x=>x.d.slice(0,4)));
      const multiYear = datedYears.size>1;
      const byY = {};
      L.forEach(x=>{ const y = (x.d||'').slice(0,4) || (multiYear ? '' : (year||'')); delete x.nd; (byY[y]=byY[y]||[]).push(x); });
      const ys = Object.keys(byY).sort();
      ys.forEach(y=>{
        const R = byY[y]; const cnt = t => R.filter(x=>x.ty===t).length;
        const multi = ys.length>1;
        sheets.push({name: (multi ? `${name} · ${y||'날짜 없는 줄'}` : name) + (stopRow&&y===ys[ys.length-1]?'':''), year:y, rows:R, d:cnt('d'), f:cnt('f'), ex:R.length-cnt('d')-cnt('f'),
          stop: stopRow, has: st.logDocs.some(d=>d.year===y),
          // 이미 기록이 있는 해는 실수로 덮어쓰지 않도록 처음엔 체크 해제
          on: /실행견적|내역서/.test(name) && !!y && Number(y)>=2023 && !st.logDocs.some(d=>d.year===y)});
      });
    });
    return {file:fileName, sheets};
  }
  // 발송여부가 빈 '요청 목록' 줄을 송부로 셀 때: 현장명·브랜드에 "최종"이 있으면 최종, 아니면 초안
  const effTy = (r, on) => (r.ty==='r' && on) ? ((/최종/.test(r.b||'') || /최종/.test(r.s||'')) ? 'f' : 'd') : r.ty;
  function renderUpload(){

          <td>${s.year?`<input class="field num" style="width:84px;height:30px" data-upyear="${i}" value="${esc(s.year)}">`:'<span class="err">연도 없음</span>'}</td>

      + (u.sheets.some(s=>s.stop)?`<div class="meta">🟧 주황색으로 칠한 줄을 찾아 그 위까지만 읽었습니다 (${[...new Set(u.sheets.filter(s=>s.stop).map(s=>s.name.split(' · ')[0]+' '+s.stop+'행'))].join(', ')}).</div>`:'')

  async function readFile(file){
    if(!file) return;
    if(!/\.(xlsx|xlsm|xls)$/i.test(file.name)){ st.upload={error:'엑셀 파일(.xlsx)만 올릴 수 있습니다.'}; renderUpload(); return; }
    if(typeof XLSX==='undefined'){ st.upload={error:'엑셀 읽기 기능을 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.'}; renderUpload(); return; }
    st.upload={busy:'엑셀을 읽는 중…'}; renderUpload();
    try{
      const buf = await file.arrayBuffer();
      const names = (XLSX.read(buf, {type:'array', bookSheets:true}).SheetNames)||[];
      if(names.includes('안내사항')){

  /* ---------- 검토 대시보드 발행 기록 (구글시트 "컨설팅 내역서 초안본/최종본 발행") ---------- */

  function parseCsv(text){
    const out=[]; let row=[], cur='', q=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); out.push(row); row=[]; cur=''; }
      else cur+=ch;
    }
    if(cur!==''||row.length){ row.push(cur); out.push(row); }
    return out;
  }
  // 칸: 초안/최종 · 현장명 · 협력사 · 담당자 · 주소 · 공종 · 발행날짜 · 최종금액 · 특이사항
  function parseSheetRows(text){
    const R = parseCsv(String(text||'').replace(/^﻿/,''));
    const h = R.findIndex(r=>r.some(x=>String(x).replace(/\s/g,'')==='현장명'));
    if(h<0) return null;
    const H = R[h].map(x=>String(x).replace(/\s/g,''));
    const ix = k => H.findIndex(x=>x.startsWith(k));
    const C = {k:ix('초안'), s:ix('현장명'), c:ix('협력사'), p:ix('담당자'), w:ix('공종'), d:ix('발행날짜'), t:ix('최종금액'), sc:ix('특이사항')};
    if(C.k<0) C.k=0;
    const g = (r,i) => i>=0 ? String(r[i]==null?'':r[i]).trim() : '';
    const rows=[];
    R.slice(h+1).forEach(r=>{
      const kind=g(r,C.k), site=g(r,C.s); if(!site) return;
      const k = /최종/.test(kind) ? 'f' : /초안/.test(kind) ? 'd' : ''; if(!k) return;
      const d = cellDate(g(r,C.d), ''); if(!d) return;
      const tn = Number(g(r,C.t).replace(/[^\d]/g,''))||null;
      const m = kind.match(/(\d+)\s*차/);
      rows.push({k, s:site, c:g(r,C.c), p:g(r,C.p), w:g(r,C.w).slice(0,80), d, t:tn, sc:g(r,C.sc).slice(0,160), seq:m?Number(m[1]):1});
    });
    return rows;
  }
  function sheetGroups(){

      const key = r.k+'|'+c+'|'+nsiteKey(r.s);

      x.n++;

  // 1) 시트를 바로 읽기 → 2) 안 되면 구글 드라이브 연결로 읽기. 읽은 기록은 현황판 저장소에 보관해서 다른 사람 화면에도 같이 보임
  async function fetchDirect(){

  function textsIn(v, out, depth){

    if(Array.isArray(v)){ v.forEach(x=>textsIn(x,out,depth+1)); return out; }
    if(typeof v==='object'){ Object.keys(v).forEach(k=>textsIn(v[k],out,depth+1)); }
    return out;
  }
  function b64utf8(s){ try{ const bin=atob(s.replace(/\s/g,'')); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder('utf-8').decode(u); }catch(e){ return ''; } }
  async function fetchViaDrive(){

    if(!mcp) return {err:'구글 드라이브 연결을 쓸 수 없는 화면입니다.'};
